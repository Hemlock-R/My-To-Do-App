<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ember – Tasks</title>
<meta name="description" content="Ember, an offline-first to-do list with smart views, checklists and local backups.">
<meta name="theme-color" content="#1c1917" id="themeColor">
<meta name="color-scheme" content="dark light">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" id="favicon" href="data:,">
<link rel="manifest" id="manifestLink">

<!-- Fonts: loaded without blocking first paint. Offline they fall back to the system stacks below,
     and the service worker caches them after the first online visit. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" media="print" onload="this.media='all'">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700&display=swap" media="print" onload="this.media='all'">

<style>
/* ==========================================================================
   1. Design tokens
   ========================================================================== */
:root{
  --font-head:'Instrument Serif','Iowan Old Style','Palatino Linotype',Georgia,serif;
  --font-body:'Satoshi','General Sans','Avenir Next','Segoe UI',system-ui,-apple-system,sans-serif;

  --ease:cubic-bezier(.22,.8,.24,1);
  --spring:cubic-bezier(.34,1.45,.64,1);

  --accent:#e2a24b;
  --accent-hi:#f0b95f;
  --clay:#b8654a;
  --on-accent:#2a1b08;

  --r-card:22px 22px 22px 8px;
  --r-panel:30px 30px 30px 12px;
}
@supports (transition-timing-function:linear(0,1)){
  :root{
    /* Damped spring, sampled so it settles without a visible tail */
    --spring:linear(0, 0.0425, 0.1457, 0.2799, 0.4233, 0.5614, 0.6851, 0.7897, 0.8737, 0.9378, 0.9841, 1.0151, 1.0339, 1.0434, 1.046, 1.044, 1.0393, 1.0331, 1.0265, 1.0202, 1.0145, 1.0097, 1.0058, 1.0029, 1.0007, 0.9993, 0.9984, 0.998, 0.9979, 0.998, 1);
  }
}

html[data-theme="dark"]{
  color-scheme:dark;
  --base-a:#262019; --base-b:#14110f; --base-c:#2a1a14;
  --text:#f2eadb; --text-2:rgba(242,234,219,.72); --text-3:rgba(242,234,219,.48);
  --glass-1:rgba(244,236,222,.045);
  --glass-2:rgba(244,236,222,.08);
  --glass-3:rgba(244,236,222,.13);
  --glass-edge:rgba(250,240,222,.15);
  --glass-hi:rgba(255,248,232,.26);
  --glass-lo:rgba(0,0,0,.3);
  --shadow:0 22px 50px -20px rgba(0,0,0,.72), 0 2px 6px -2px rgba(0,0,0,.35);
  --chip-bg:rgba(244,236,222,.07); --chip-edge:rgba(250,240,222,.1);
  --field-bg:rgba(10,8,7,.3);
  --accent-text:#ecb467; --danger-text:#f19379; --danger-bg:rgba(224,96,75,.16);
  --scrim:rgba(9,7,6,.58);
  --orb-1:rgba(226,162,75,.5); --orb-2:rgba(184,96,70,.5); --orb-3:rgba(150,120,82,.34);
  --opt-bg:#27221d;
  --p-low:#9eae8a; --p-medium:#e2a24b; --p-high:#d4825a; --p-urgent:#e5634e;
  --grain:.07;
}
html[data-theme="light"]{
  color-scheme:light;
  --base-a:#f2e9d7; --base-b:#e2d3b8; --base-c:#ecd5c0;
  --text:#2b241d; --text-2:rgba(43,36,29,.74); --text-3:rgba(43,36,29,.52);
  --glass-1:rgba(255,251,242,.34);
  --glass-2:rgba(255,251,242,.56);
  --glass-3:rgba(255,252,247,.78);
  --glass-edge:rgba(255,255,255,.72);
  --glass-hi:rgba(255,255,255,.95);
  --glass-lo:rgba(120,84,40,.13);
  --shadow:0 20px 44px -22px rgba(96,62,28,.46), 0 2px 6px -2px rgba(96,62,28,.16);
  --chip-bg:rgba(60,42,22,.06); --chip-edge:rgba(60,42,22,.09);
  --field-bg:rgba(255,255,255,.5);
  --accent-text:#94550a; --danger-text:#b13c27; --danger-bg:rgba(200,70,50,.12);
  --scrim:rgba(80,56,30,.3);
  --orb-1:rgba(232,160,64,.7); --orb-2:rgba(196,106,76,.5); --orb-3:rgba(255,255,255,.85);
  --opt-bg:#f7f0e3;
  --p-low:#6f8460; --p-medium:#c4851d; --p-high:#b95b33; --p-urgent:#c43a2a;
  --grain:.09;
}

/* ==========================================================================
   2. Base
   ========================================================================== */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{
  margin:0;
  font-family:var(--font-body);
  font-size:16px;
  line-height:1.5;
  color:var(--text);
  background:
    radial-gradient(1100px 760px at 85% -10%, var(--base-c), transparent 62%),
    linear-gradient(160deg,var(--base-a),var(--base-b));
  background-attachment:fixed;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
  transition:color .4s var(--ease);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3,p{margin:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
::selection{background:var(--accent);color:var(--on-accent)}
mark{background:rgba(226,162,75,.35);color:inherit;border-radius:4px;padding:0 2px}
.i{flex:none;display:block}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* Ambient layers behind the glass: they give the blur something to refract */
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.orb{position:absolute;border-radius:50%}
.o1{width:58vmax;height:58vmax;left:-14vmax;top:-18vmax;background:radial-gradient(circle,var(--orb-1),transparent 66%)}
.o2{width:54vmax;height:54vmax;right:-16vmax;bottom:-20vmax;background:radial-gradient(circle,var(--orb-2),transparent 66%)}
.o3{width:34vmax;height:34vmax;left:36%;top:30%;background:radial-gradient(circle,var(--orb-3),transparent 68%)}
.bg::after{
  content:"";position:absolute;inset:0;opacity:var(--grain);
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
}

/* Frosted glass: translucent gradient, bright top edge, soft inner shadow, backdrop blur */
.glass{
  --blur:22px;
  background:linear-gradient(145deg,var(--glass-3),var(--glass-2));
  border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 var(--glass-hi), inset 0 -1px 0 var(--glass-lo), var(--shadow);
  -webkit-backdrop-filter:blur(var(--blur)) saturate(1.5);
  backdrop-filter:blur(var(--blur)) saturate(1.5);
}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
  .glass{background:linear-gradient(145deg,var(--opt-bg),var(--base-b))}
}

/* ==========================================================================
   3. Layout
   ========================================================================== */
.app{position:relative;z-index:1;display:grid;grid-template-columns:296px minmax(0,1fr);gap:18px;height:100dvh;padding:18px}
.sidebar{--blur:30px;display:flex;flex-direction:column;border-radius:var(--r-panel);overflow:hidden;min-height:0}
.main{
  position:relative;min-width:0;min-height:0;overflow-y:auto;overflow-x:hidden;
  border-radius:var(--r-panel);
  background:var(--glass-1);
  border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 0 var(--glass-hi);
  padding:30px clamp(16px,3.2vw,44px) 140px;
  scroll-behavior:smooth;
  scrollbar-width:thin;scrollbar-color:var(--glass-edge) transparent;
}
.main:focus{outline:none}

/* Sidebar */
.brand{display:flex;align-items:center;gap:12px;padding:24px 24px 14px}
.brand-mark{width:36px;height:36px;flex:none;filter:drop-shadow(0 6px 14px rgba(226,162,75,.35))}
.brand-name{font-family:var(--font-head);font-size:2rem;line-height:1;letter-spacing:-.01em}
.side-scroll{flex:1;min-height:0;overflow-y:auto;padding:6px 14px 10px;scrollbar-width:thin;scrollbar-color:var(--glass-edge) transparent}
.views,.tag-list{display:flex;flex-direction:column;gap:2px}
.side-h{font-family:var(--font-head);font-style:italic;font-weight:400;font-size:1.15rem;color:var(--text-2);margin:20px 12px 8px}
.nav-item{
  position:relative;display:flex;align-items:center;gap:12px;width:100%;height:42px;padding:0 10px 0 12px;
  border-radius:14px;color:var(--text-2);font-weight:500;font-size:.94rem;text-align:left;
  transition:background .25s var(--ease),color .25s var(--ease),transform .5s var(--spring);
}
.nav-item:hover{background:var(--glass-2);color:var(--text)}
.nav-item:active{transform:scale(.975)}
.nav-item.active{
  color:var(--text);
  background:linear-gradient(120deg,rgba(226,162,75,.26),rgba(184,101,74,.12));
  box-shadow:inset 0 1px 0 var(--glass-hi), inset 0 0 0 1px rgba(226,162,75,.28);
}
.nav-item.active .i{color:var(--accent-text)}
.nav-label{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.count{
  min-width:26px;padding:1px 8px;border-radius:999px;text-align:center;font-size:.78rem;font-weight:600;
  font-variant-numeric:tabular-nums;background:var(--chip-bg);color:var(--text-2);
}
.count.hot{background:var(--danger-bg);color:var(--danger-text)}
.count.bump{animation:bump .55s var(--spring)}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.3)}100%{transform:scale(1)}}
.tdot{width:10px;height:10px;border-radius:50%;flex:none;margin:0 4px;box-shadow:0 0 0 3px var(--chip-bg)}
.side-foot{padding:12px 14px 16px;border-top:1px solid var(--glass-edge);display:grid;gap:8px}
.data-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.data-grid .wide{grid-column:1/-1}
.data-grid .btn{min-width:0;padding:0 8px;gap:6px;font-size:.82rem}
.status{display:flex;align-items:center;gap:8px;padding:6px 6px 0;font-size:.8rem;color:var(--text-3)}
.dot{width:8px;height:8px;border-radius:50%;background:#9eae8a;box-shadow:0 0 0 3px rgba(158,174,138,.2);transition:background .3s}
.status.offline .dot{background:var(--accent);box-shadow:0 0 0 3px rgba(226,162,75,.22)}
.status.pulse .dot{animation:bump .6s var(--spring)}

/* Header */
.mtop{display:none}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:22px}
.head h1{font-family:var(--font-head);font-weight:400;font-size:clamp(2.8rem,6.4vw,4.6rem);line-height:.92;letter-spacing:-.025em}
.head p{margin-top:12px;font-family:var(--font-head);font-style:italic;font-size:1.3rem;color:var(--text-2)}

/* Buttons */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:14px;
  font-weight:600;font-size:.9rem;white-space:nowrap;border:1px solid transparent;
  transition:transform .5s var(--spring),background .25s var(--ease),filter .25s,box-shadow .25s;
}
.btn:active{transform:scale(.96)}
.btn.primary{
  color:var(--on-accent);
  background:linear-gradient(180deg,var(--accent-hi),#d38f35);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 8px 20px -8px rgba(226,162,75,.7);
}
.btn.primary:hover{filter:brightness(1.07)}
.btn.soft{background:var(--glass-2);border-color:var(--glass-edge);box-shadow:inset 0 1px 0 var(--glass-hi);color:var(--text)}
.btn.soft:hover{background:var(--glass-3)}
.btn.ghost{color:var(--text-2);border-color:var(--glass-edge)}
.btn.ghost:hover{background:var(--glass-2);color:var(--text)}
.btn.danger{background:var(--danger-bg);color:var(--danger-text);border-color:rgba(224,96,75,.3)}
.btn.danger:hover{filter:brightness(1.12)}
.btn.sm{height:34px;padding:0 12px;font-size:.84rem;border-radius:12px}
.icon-btn{
  width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--text-2);flex:none;
  transition:background .25s var(--ease),color .25s,transform .5s var(--spring);
}
.icon-btn:hover{background:var(--glass-2);color:var(--text)}
.icon-btn:active{transform:scale(.9)}
.icon-btn.sm{width:30px;height:30px;border-radius:10px}
.icon-btn.bordered{border:1px solid var(--glass-edge);background:var(--glass-2);box-shadow:inset 0 1px 0 var(--glass-hi)}

/* Theme toggle: sun and moon trade places */
.theme-btn .sun,.theme-btn .moon{grid-area:1/1;transition:transform .6s var(--spring),opacity .3s}
html[data-theme="dark"] .theme-btn .sun{transform:rotate(-90deg) scale(.4);opacity:0}
html[data-theme="light"] .theme-btn .moon{transform:rotate(90deg) scale(.4);opacity:0}

/* Quick add */
.quick{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:8px 8px 8px 16px;border-radius:22px 22px 22px 8px;--blur:20px}
.quick .q-plus{color:var(--accent-text)}
.quick input{flex:1 1 180px;min-width:0;height:44px;background:none;border:0;outline:0;font-size:1.04rem}
.quick input::placeholder{color:var(--text-3)}
.pill-btn{
  display:inline-flex;align-items:center;gap:8px;height:34px;padding:0 12px;border-radius:999px;
  background:var(--chip-bg);border:1px solid var(--chip-edge);font-size:.82rem;font-weight:500;color:var(--text-2);
  transition:transform .5s var(--spring),background .25s;
}
.pill-btn:hover{background:var(--glass-3);color:var(--text)}
.pill-btn:active{transform:scale(.94)}
.pdot{width:9px;height:9px;border-radius:50%;background:var(--pc,var(--text-3));flex:none}
.shake{animation:shake .4s var(--ease)}
@keyframes shake{20%{transform:translateX(-6px)}40%{transform:translateX(5px)}60%{transform:translateX(-3px)}80%{transform:translateX(2px)}}

/* Toolbar */
.toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:16px 0 20px}
.search{position:relative;flex:1 1 240px;min-width:200px;color:var(--text-3)}
.search .i{position:absolute;left:14px;top:50%;transform:translateY(-50%);pointer-events:none}
.field-ctl,.search input,.select{
  height:38px;border-radius:12px;background:var(--field-bg);border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.14);font-size:.86rem;
}
.search input{width:100%;padding:0 12px 0 40px;outline:0;color:var(--text)}
.search input::placeholder{color:var(--text-3)}
.search input:focus,.select:focus,.field input:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(226,162,75,.22)}
.select{
  appearance:none;-webkit-appearance:none;padding:0 32px 0 12px;color:var(--text);cursor:pointer;max-width:100%;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='12' height='8' viewBox='0 0 12 8' fill='none' stroke='%23a89a85' stroke-width='1.8' stroke-linecap='round' stroke-linejoin='round'><path d='M1 1.5l5 5 5-5'/></svg>");
  background-repeat:no-repeat;background-position:right 12px center;
}
.select option{background:var(--opt-bg);color:var(--text)}

/* ==========================================================================
   4. Tasks
   ========================================================================== */
.list{display:block}
.task{
  --pc:var(--p-medium);
  --blur:16px;
  position:relative;display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;align-items:start;gap:6px 10px;
  margin-bottom:10px;padding:14px 12px 14px 4px;border-radius:var(--r-card);overflow:hidden;
  transition:transform .45s var(--spring),border-color .25s,background .25s;
}
.task.p-low{--pc:var(--p-low)} .task.p-medium{--pc:var(--p-medium)}
.task.p-high{--pc:var(--p-high)} .task.p-urgent{--pc:var(--p-urgent)}
.task::before{content:"";position:absolute;left:0;top:16px;bottom:16px;width:3px;border-radius:0 4px 4px 0;background:var(--pc);opacity:.95}
.task::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(105deg,transparent 36%,rgba(255,244,222,.17) 50%,transparent 64%);
  transform:translateX(-125%);
}
@media (hover:hover){
  .task:hover{transform:translateY(-1px);border-color:rgba(226,162,75,.35)}
  .task:hover::after{transform:translateX(125%);transition:transform .95s var(--ease)}
}
.task.enter{animation:cardIn .55s var(--spring) both}
.list.stagger .task{animation:cardIn .5s var(--spring) both;animation-delay:var(--d,0ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.985)}to{opacity:1;transform:none}}
.task.leaving{
  transition:height .34s var(--ease),opacity .26s,transform .34s var(--ease),margin .34s var(--ease),padding .34s var(--ease),border-width .34s;
  height:0!important;opacity:0;margin-bottom:0;padding-top:0;padding-bottom:0;border-width:0;transform:translateX(30px) scale(.98);
}
.task.just-done::after{animation:sweep .95s var(--ease)}
@keyframes sweep{from{transform:translateX(-125%)}to{transform:translateX(125%)}}
.task.drag-src{opacity:.32;outline:1.5px dashed var(--glass-edge);outline-offset:-3px}
.task.ghost{
  position:fixed;z-index:95;margin:0;pointer-events:none;animation:none;transform:rotate(-.7deg) scale(1.02);
  box-shadow:inset 0 1px 0 var(--glass-hi),0 34px 64px -18px rgba(0,0,0,.75);
  background:linear-gradient(145deg,var(--glass-3),var(--glass-2));
}
.task.ghost::after{display:none}

.grip{width:28px;height:36px;display:grid;place-items:center;color:var(--text-3);cursor:grab;touch-action:none;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none;border-radius:10px}
.grip:hover{color:var(--text)}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;user-select:none;-webkit-user-select:none}

.check{
  position:relative;width:26px;height:26px;margin-top:5px;border-radius:50%;flex:none;
  border:1.6px solid var(--text-3);display:grid;place-items:center;
  transition:background .3s var(--ease),border-color .3s,transform .6s var(--spring);
}
.check:hover{border-color:var(--accent);transform:scale(1.1)}
.check:active{transform:scale(.88)}
.check svg{width:16px;height:16px;fill:none;stroke:var(--on-accent);stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:22;stroke-dashoffset:22;transition:stroke-dashoffset .4s var(--ease) .06s}
.check::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid var(--accent);opacity:0}
.task.done .check{background:linear-gradient(160deg,var(--accent-hi),var(--accent));border-color:var(--accent)}
.task.done .check svg{stroke-dashoffset:0}
.task.just-done .check::after{animation:ring .65s var(--ease)}
@keyframes ring{0%{opacity:.95;transform:scale(.7)}100%{opacity:0;transform:scale(2.1)}}

.t-main{min-width:0;padding-top:4px;cursor:pointer}
.t-title{font-weight:600;font-size:1.04rem;line-height:1.35;overflow-wrap:anywhere}
.t-text{
  background:linear-gradient(currentColor,currentColor) no-repeat 0 58%/0 1.6px;
  transition:background-size .5s var(--ease),color .35s;
}
.task.done .t-text{background-size:100% 1.6px;color:var(--text-3)}
.t-desc{margin-top:3px;font-size:.88rem;color:var(--text-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.task.done .t-desc{color:var(--text-3)}
.t-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{
  display:inline-flex;align-items:center;gap:6px;height:25px;padding:0 10px;border-radius:999px;
  font-size:.76rem;font-weight:500;color:var(--text-2);background:var(--chip-bg);border:1px solid var(--chip-edge);
}
.chip .i{opacity:.8}
.chip.today{color:var(--accent-text);border-color:rgba(226,162,75,.35);background:rgba(226,162,75,.1)}
.chip.overdue{color:var(--danger-text);background:var(--danger-bg);border-color:rgba(224,96,75,.35)}
.chip.prio i{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.chip.tag i{width:8px;height:8px;border-radius:50%}
button.chip{transition:background .25s,transform .5s var(--spring)}
button.chip:hover{background:var(--glass-3);color:var(--text)}
button.chip:active{transform:scale(.94)}
.chip .bar{width:28px;height:4px;border-radius:4px;background:var(--chip-edge);overflow:hidden}
.chip .bar b{display:block;height:100%;width:var(--pct,0%);background:var(--accent);transition:width .4s var(--ease)}
.subs{grid-column:3/-1;margin-top:6px;display:grid;gap:2px;animation:cardIn .4s var(--spring) both}
.sub-row{display:flex;align-items:center;gap:10px;min-height:32px;padding:2px 6px;border-radius:10px;font-size:.9rem;color:var(--text-2);cursor:pointer;text-align:left;width:100%}
.sub-row:hover{background:var(--glass-2)}
.sub-row.done span{color:var(--text-3);text-decoration:line-through;text-decoration-thickness:1px}
.mini-check{
  width:18px;height:18px;border-radius:6px;flex:none;border:1.5px solid var(--text-3);display:grid;place-items:center;
  transition:background .25s,border-color .25s,transform .5s var(--spring);
}
.mini-check svg{width:12px;height:12px;fill:none;stroke:var(--on-accent);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:opacity .2s,transform .5s var(--spring)}
.done>.mini-check,.mini-check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.done>.mini-check svg,.mini-check[aria-checked="true"] svg{opacity:1;transform:none}
.t-actions{display:flex;gap:2px;margin-top:2px;transition:opacity .25s}
@media (hover:hover){
  .t-actions{opacity:0}
  .task:hover .t-actions,.task:focus-within .t-actions{opacity:1}
}

/* Empty state */
.empty{display:grid;justify-items:center;text-align:center;gap:10px;padding:60px 16px}
.empty .orb-mark{
  width:92px;height:92px;border-radius:50%;display:grid;place-items:center;margin-bottom:8px;--blur:14px;
}
.empty .orb-mark svg{width:42px;height:42px}
.empty h2{font-family:var(--font-head);font-weight:400;font-size:2rem;line-height:1.1}
.empty p{color:var(--text-2);max-width:34ch}
.empty .btn{margin-top:8px}

/* Priority dock: appears while dragging, drop a task on a level to set it */
.dock{
  position:fixed;right:14px;top:50%;z-index:92;display:grid;gap:8px;padding:12px;border-radius:26px 26px 26px 10px;
  transform:translate(140%,-50%);transition:transform .55s var(--spring);--blur:26px;
}
.dock.show{transform:translate(0,-50%)}
.dock-cap{font-family:var(--font-head);font-style:italic;color:var(--text-2);text-align:center;font-size:1.05rem;padding:2px 0 2px}
.dock-btn{
  --pc:var(--p-medium);display:flex;align-items:center;gap:10px;width:112px;height:46px;padding:0 14px;border-radius:15px;
  font-weight:600;font-size:.88rem;border:1px solid var(--chip-edge);background:var(--chip-bg);
  transition:transform .5s var(--spring),background .2s,border-color .2s;
}
.dock-btn[data-prio="low"]{--pc:var(--p-low)} .dock-btn[data-prio="high"]{--pc:var(--p-high)} .dock-btn[data-prio="urgent"]{--pc:var(--p-urgent)}
.dock-btn i{width:10px;height:10px;border-radius:50%;background:var(--pc)}
.dock-btn.over{transform:scale(1.08);border-color:var(--pc);background:color-mix(in srgb,var(--pc) 24%,transparent)}

/* ==========================================================================
   5. Overlay, forms, toasts
   ========================================================================== */
.overlay{position:fixed;inset:0;z-index:80;display:grid;place-items:center;padding:16px}
.o-scrim{position:absolute;inset:0;background:var(--scrim);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);animation:fade .3s var(--ease)}
.overlay.closing .o-scrim{opacity:0;transition:opacity .18s}
.overlay.closing .o-panel{opacity:0;transform:translateY(10px) scale(.98);transition:opacity .18s,transform .18s}
@keyframes fade{from{opacity:0}to{opacity:1}}
.o-panel{
  --blur:38px;position:relative;width:min(640px,100%);max-height:calc(100dvh - 32px);display:flex;flex-direction:column;
  border-radius:var(--r-panel);animation:popIn .6s var(--spring);overflow:hidden;
}
.o-panel.dlg-panel{width:min(500px,100%)}
@keyframes popIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
.o-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:22px 24px 8px}
.o-head h2{font-family:var(--font-head);font-weight:400;font-size:2.2rem;line-height:1}
.o-body{padding:10px 24px 8px;overflow-y:auto;display:grid;gap:16px;scrollbar-width:thin;scrollbar-color:var(--glass-edge) transparent}
.o-foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 24px 22px}
.o-foot .grow{flex:1}
.dlg-copy{color:var(--text-2);font-size:.95rem}
.dlg-copy strong{color:var(--text);font-weight:600}
.dlg-list{margin:0;padding:0 0 0 18px;color:var(--text-2);font-size:.9rem;display:grid;gap:4px}
.mode-card{padding:12px 14px;border-radius:16px;background:var(--chip-bg);border:1px solid var(--chip-edge);font-size:.9rem;color:var(--text-2)}
.mode-card strong{display:block;color:var(--text);font-weight:600;margin-bottom:2px}

.field{display:grid;gap:6px;border:0;padding:0;margin:0;min-width:0}
.field>span,.field>legend{font-size:.85rem;font-weight:500;color:var(--text-2);padding:0}
.field input,.field textarea{
  width:100%;min-height:42px;padding:9px 12px;border-radius:12px;background:var(--field-bg);border:1px solid var(--glass-edge);
  box-shadow:inset 0 1px 3px rgba(0,0,0,.14);outline:0;resize:vertical;
}
.field input[name="title"]{font-size:1.1rem;font-weight:600}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.quick-dates{display:flex;flex-wrap:wrap;gap:6px;margin-top:-6px}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.seg span{
  --pc:var(--p-medium);display:flex;align-items:center;justify-content:center;gap:8px;height:40px;border-radius:12px;
  font-size:.86rem;font-weight:600;background:var(--chip-bg);border:1px solid var(--chip-edge);color:var(--text-2);
  transition:transform .5s var(--spring),background .25s,border-color .25s,color .25s;
}
.seg label[data-p="low"] span{--pc:var(--p-low)} .seg label[data-p="high"] span{--pc:var(--p-high)} .seg label[data-p="urgent"] span{--pc:var(--p-urgent)}
.seg span::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--pc)}
.seg input:checked+span{background:color-mix(in srgb,var(--pc) 22%,transparent);border-color:var(--pc);color:var(--text);transform:translateY(-1px)}
.seg input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.tag-suggest{display:flex;flex-wrap:wrap;gap:6px}
.sub-edit{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.sub-edit input{flex:1;min-height:38px;padding:6px 10px}
.sub-edit.done input{color:var(--text-3);text-decoration:line-through}
.sub-add{display:flex;gap:8px}
.sub-add input{flex:1}

.toasts{position:fixed;z-index:120;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);display:grid;gap:8px;justify-items:center;width:min(94vw,460px);pointer-events:none}
.toast{
  --blur:26px;pointer-events:auto;display:flex;align-items:center;gap:12px;width:100%;padding:10px 12px 10px 16px;
  border-radius:18px 18px 18px 6px;font-size:.92rem;opacity:0;transform:translateY(18px) scale(.96);
  transition:opacity .25s,transform .55s var(--spring);
}
.toast.in{opacity:1;transform:none}
.toast .t-ico{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;flex:none;background:var(--chip-bg)}
.toast.success .t-ico{background:rgba(158,174,138,.25);color:#9eae8a}
.toast.error .t-ico{background:var(--danger-bg);color:var(--danger-text)}
.toast.info .t-ico{background:rgba(226,162,75,.2);color:var(--accent-text)}
.toast .t-msg{flex:1;min-width:0;overflow-wrap:anywhere}
.toast .t-act{height:32px;padding:0 12px;border-radius:10px;font-weight:700;color:var(--accent-text);transition:background .2s}
.toast .t-act:hover{background:var(--chip-bg)}

.scrim{display:none}

/* ==========================================================================
   6. Responsive
   ========================================================================== */
@media (max-width:900px){
  .app{grid-template-columns:1fr;padding:8px;gap:0}
  .sidebar{
    position:fixed;z-index:70;left:8px;top:8px;bottom:8px;width:min(320px,88vw);
    transform:translateX(-118%);transition:transform .6s var(--spring);
  }
  .nav-open .sidebar{transform:none}
  .scrim{
    display:block;position:fixed;inset:0;z-index:65;background:var(--scrim);opacity:0;pointer-events:none;
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:opacity .35s var(--ease);
  }
  .nav-open .scrim{opacity:1;pointer-events:auto}
  .main{border-radius:26px 26px 26px 10px;padding:0 14px 130px}
  .mtop{
    display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:20;
    margin:0 -14px 16px;padding:10px 12px;
    background:linear-gradient(180deg,var(--glass-3),var(--glass-1));
    -webkit-backdrop-filter:blur(22px) saturate(1.5);backdrop-filter:blur(22px) saturate(1.5);
    border-bottom:1px solid var(--glass-edge);
  }
  .mtop .brand-inline{display:flex;align-items:center;gap:8px;font-family:var(--font-head);font-size:1.6rem;line-height:1}
  .mtop .brand-inline svg{width:26px;height:26px}
  .head{margin-bottom:16px}
  .head-actions{display:none}
  .quick{padding:10px 10px 10px 14px}
  .quick input{flex:1 1 calc(100% - 44px)}
  .quick #quickPriority{margin-right:auto}
  .toolbar .search{flex:1 1 100%}
  .toolbar .select{flex:1 1 calc(50% - 4px);min-width:0}
  .head p{font-size:1.15rem}
  .task{grid-template-columns:auto auto minmax(0,1fr);padding-right:10px}
  .t-actions{grid-column:3;justify-self:start;margin-top:0}
  .grip{width:32px;height:44px}
  .field-row{grid-template-columns:1fr 1fr}
  .overlay{align-items:end;padding:0}
  .o-panel{width:100%!important;max-height:92dvh;border-radius:28px 28px 0 0;animation:sheetIn .55s var(--spring)}
  .o-foot{padding-bottom:calc(20px + env(safe-area-inset-bottom))}
  .dock{right:8px;padding:10px}
  .dock-btn{width:100px;height:44px}
}
@keyframes sheetIn{from{transform:translateY(60%);opacity:.4}to{transform:none;opacity:1}}
@media (max-width:420px){
  .seg{grid-template-columns:1fr 1fr}
  .o-head h2{font-size:1.9rem}
  .o-body,.o-head,.o-foot{padding-left:18px;padding-right:18px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition-duration:.01ms!important;scroll-behavior:auto!important}
}

      <button class="icon-btn sm" type="button" data-act="edit" aria-label="Edit task" title="Edit">${icon('edit', 16)}</button>
      <button class="icon-btn sm" type="button" data-act="dup" aria-label="Duplicate task" title="Duplicate">${icon('copy', 16)}</button>
      <button class="icon-btn sm" type="button" data-act="del" aria-label="Delete task" title="Delete">${icon('trash', 16)}</button>
    </div>
    ${subs}
  </article>`;
}

function emptyHTML() {

let lastItems = [];
function renderList() {

const cardEl = id => [...els.list.children].find(el => el.dataset && el.dataset.id === id);

/* ==========================================================================
   7. Toasts
   ========================================================================== */
function toast(msg, { type = 'info', action = null, duration = 4400 } = {}) {
  const box = $('#toasts');
  while (box.children.length >= 3) box.firstElementChild.remove();
  const el = document.createElement('div');
  el.className = `toast glass ${type}`;
  el.innerHTML = `<span class="t-ico">${icon(type === 'success' ? 'ok' : type === 'error' ? 'warn' : 'info', 15)}</span><span class="t-msg"></span>${action ? '<button class="t-act" type="button"></button>' : ''}`;
  $('.t-msg', el).textContent = msg;
  let timer;
  const kill = () => { clearTimeout(timer); el.classList.remove('in'); setTimeout(() => el.remove(), 350); };
  if (action) {
    const b = $('.t-act', el); b.textContent = action.label;
    b.addEventListener('click', () => { kill(); action.run(); });
  }
  box.appendChild(el);
  requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  timer = setTimeout(kill, duration);
}

/* ==========================================================================
   8. Task operations (all go through save() and a re-render)
   ========================================================================== */
const snapshot = () => JSON.stringify({ tasks: state.tasks, categories: state.categories });
function restore(snap) {
  const s = JSON.parse(snap);
  state.tasks = s.tasks; state.categories = s.categories;
  save(); renderAll();
}
const undoAction = snap => ({ label: 'Undo', run: () => restore(snap) });

function defaultDueForView() {
  const v = state.settings.view;
  return ['today', 'week', 'month', 'year'].includes(v) ? ranges().today : '';
}
function addTask(data) {
  const { task } = normalizeTask({ ...data, createdAt: Date.now(), updatedAt: Date.now() });
  if (!task) return null;
  task.tag = canonicalTag(task.tag);
  state.tasks.unshift(task);
  ensureCategories();
  ui.enterIds.add(task.id);
  save(); renderAll();
  return task;
}
function toggleComplete(id) {
  const t = byId(id); if (!t) return;
  const snap = snapshot();
  t.completed = !t.completed;
  t.completedAt = t.completed ? Date.now() : null;
  t.updatedAt = Date.now();
  save();
  // Update the card in place so the check animation plays, then let it leave if the view no longer includes it
  const card = cardEl(id);
  if (card) {
    card.classList.toggle('done', t.completed);
    card.classList.toggle('just-done', t.completed);
    $('.check', card).setAttribute('aria-checked', String(t.completed));
  }
  renderSidebar(); renderHeader();
  if (t.completed) toast(`Completed “${t.title.length > 40 ? t.title.slice(0, 40) + '…' : t.title}”`, { type: 'success', action: undoAction(snap), duration: 3800 });
  setTimeout(() => {
    const c = cardEl(id), cur = byId(id);
    if (!c || !cur) return;
    if (!getVisible().some(x => x.id === id)) collapseCard(c, () => renderList());
  }, 750);
}
function collapseCard(card, done) {
  card.style.height = card.offsetHeight + 'px';
  void card.offsetHeight;
  card.classList.add('leaving');
  setTimeout(done, 350);
}
function toggleSub(id, subId) {
  const t = byId(id); if (!t) return;
  const s = t.subtasks.find(x => x.id === subId); if (!s) return;
  s.done = !s.done; t.updatedAt = Date.now();
  save(); renderList(); renderSidebar();
}
function deleteTask(id) {
  const t = byId(id); if (!t) return;
  const snap = snapshot();
  state.tasks = state.tasks.filter(x => x.id !== id);
  save();
  const card = cardEl(id);
  const finish = () => { renderAll(); };
  if (card) { renderSidebar(); collapseCard(card, finish); } else finish();
  toast(`Deleted “${t.title.length > 40 ? t.title.slice(0, 40) + '…' : t.title}”`, { type: 'info', action: undoAction(snap) });
}
function duplicateTask(id) {
  const src = byId(id); if (!src) return;
  const copy = JSON.parse(JSON.stringify(src));
  copy.id = uid();
  copy.title = (src.title + ' (copy)').slice(0, 300);
  copy.completed = false; copy.completedAt = null;
  copy.subtasks = copy.subtasks.map(s => ({ ...s, id: uid(), done: false }));
  copy.createdAt = copy.updatedAt = Date.now();
  state.tasks.splice(state.tasks.indexOf(src) + 1, 0, copy);
  ui.enterIds.add(copy.id);
  save(); renderAll();
  const shown = getVisible().some(x => x.id === copy.id);
  toast(shown ? 'Task duplicated' : 'Task duplicated. It is open and outside this view.', { type: 'success' });
}
function clearCompleted() {
  const n = state.tasks.filter(t => t.completed).length;
  if (!n) return toast('No completed tasks to clear.', { type: 'info' });
  const snap = snapshot();
  state.tasks = state.tasks.filter(t => !t.completed);
  save(); renderAll();
  toast(`Cleared ${n} completed task${n === 1 ? '' : 's'}`, { type: 'success', action: undoAction(snap) });
}
function setPriority(id, prio) {
  const t = byId(id); if (!t || t.priority === prio) return;
  const snap = snapshot();
  t.priority = prio; t.updatedAt = Date.now();
  save(); renderAll();
  toast(`Priority set to ${PRIORITY_MAP[prio].label}`, { type: 'success', action: undoAction(snap) });
}
function commitOrder() {
  // Visible tasks keep their slots in the master list; only their sequence changes
  const ids = $$('.task', els.list).map(el => el.dataset.id);
  const set = new Set(ids), slots = [];
  state.tasks.forEach((t, i) => { if (set.has(t.id)) slots.push(i); });
  const map = new Map(state.tasks.map(t => [t.id, t]));
  ids.forEach((id, k) => { state.tasks[slots[k]] = map.get(id); });
}

const overlay = $('#overlay'), oPanel = $('#oPanel');
let lastFocus = null, closeTimer = null;
function openOverlay(html, { cls = '', onOpen } = {}) {
  clearTimeout(closeTimer);
  if (overlay.hidden) lastFocus = document.activeElement;
  oPanel.className = 'o-panel glass ' + cls;
  oPanel.innerHTML = html;
  overlay.hidden = false; overlay.classList.remove('closing');
  // restart the pop-in animation
  oPanel.style.animation = 'none'; void oPanel.offsetWidth; oPanel.style.animation = '';
  if (onOpen) onOpen(oPanel);
  requestAnimationFrame(() => {
    const f = $('[autofocus]', oPanel) || $('input:not([type=hidden]),textarea,select', oPanel) || $('button', oPanel);
    if (f) f.focus({ preventScroll: true });
  });
}
function closeOverlay() {
  if (overlay.hidden || overlay.classList.contains('closing')) return;
  overlay.classList.add('closing');
  closeTimer = setTimeout(() => {
    overlay.hidden = true; overlay.classList.remove('closing'); oPanel.innerHTML = '';
    if (lastFocus && lastFocus.focus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }, 190);
}

function dialog({ title, body, actions }) {

/* Task editor: create (id = null) or edit */

  const html = `
  <form id="taskForm" novalidate style="display:contents">

        <button type="button" class="pill-btn" data-qd="nextweek">Next Monday</button>
        <button type="button" class="pill-btn" data-qd="none">No date</button>
      </div>
      <fieldset class="field"><legend>Priority</legend>

      ${tags.length ? `<div class="tag-suggest">${tags.map(n => `<button type="button" class="chip tag" data-pick-tag="${esc(n)}"><i style="background:${tagColor(n)}"></i>${esc(n)}</button>`).join('')}</div>` : ''}
      <div class="field"><span>Checklist</span>
        <div id="subEditor"></div>
        <div class="sub-add"><input id="subNew" maxlength="200" autocomplete="off" placeholder="Add a step, then press Enter" aria-label="New checklist step">
          <button type="button" class="btn soft sm" id="subAdd">Add step</button></div>
      </div>
    </div>
    <div class="o-foot">
      ${editing ? `<button type="button" class="btn danger sm" data-ed="delete">${icon('trash', 15)}Delete</button><button type="button" class="btn ghost sm" data-ed="dup">${icon('copy', 15)}Duplicate</button>` : ''}
      <span class="grow"></span>
      <button type="button" class="btn ghost" data-close>Cancel</button>
      <button type="submit" class="btn primary">${editing ? 'Save changes' : 'Add task'}</button>
    </div>
  </form>`;

  openOverlay(html, {
    cls: 'editor-panel',
    onOpen(p) {
      const form = $('#taskForm', p), box = $('#subEditor', p), subNew = $('#subNew', p);
      const renderSubs = () => {
        box.innerHTML = draftSubs.map((s, i) => `<div class="sub-edit${s.done ? ' done' : ''}" data-i="${i}">
          <button type="button" class="mini-check" role="checkbox" aria-checked="${s.done}" data-sa="toggle" aria-label="Mark step done">${CHECK_SVG}</button>
          <input value="${esc(s.text)}" maxlength="200" data-sa="text" aria-label="Step ${i + 1}">
          <button type="button" class="icon-btn sm" data-sa="remove" aria-label="Remove step">${icon('close', 14)}</button></div>`).join('');
      };
      renderSubs();
      const addSub = () => {
        const text = subNew.value.trim(); if (!text) return;
        draftSubs.push({ id: uid(), text: text.slice(0, 200), done: false });
        subNew.value = ''; renderSubs(); subNew.focus();
      };
      $('#subAdd', p).addEventListener('click', addSub);
      subNew.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addSub(); } });
      box.addEventListener('click', e => {
        const b = e.target.closest('[data-sa]'); if (!b) return;

          f.title.focus(); return toast('Give the task a title first.', { type: 'error' });
        }

        const data = {
          title, description: f.description.value.trim(), dueDate, dueTime,
          priority: f.priority.value, tag: canonicalTag(f.tag.value),
          subtasks: draftSubs.map(s => ({ ...s, text: s.text.trim() })).filter(s => s.text),
        };
        if (editing) {

          ensureCategories(); save(); renderAll();

        } else {
          addTask(data);

        }
        closeOverlay();
      });
    },
  });
}

/* ==========================================================================
   10. Import and export
   ========================================================================== */
function download(blob, name) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
}
function buildBackup() {
  return { app: APP_ID, schemaVersion: SCHEMA, exportedAt: new Date().toISOString(), tasks: state.tasks, categories: state.categories, settings: state.settings };
}
function exportJSON() {
  const name = `todolist_backup_${ymd(new Date())}.json`;
  download(new Blob([JSON.stringify(buildBackup(), null, 2)], { type: 'application/json' }), name);
  toast(`Exported ${state.tasks.length} task${state.tasks.length === 1 ? '' : 's'} to ${name}`, { type: 'success' });
}
function toCSV() {
  const head = ['id', 'title', 'description', 'due_date', 'due_time', 'priority', 'tag', 'status', 'completed_at', 'checklist', 'created_at'];
  const cell = v => { const s = v == null ? '' : String(v); return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const iso = ms => (ms ? new Date(ms).toISOString() : '');
  const rows = state.tasks.map(t => [
    t.id, t.title, t.description, t.dueDate, t.dueTime, t.priority, t.tag, t.completed ? 'completed' : 'open',
    iso(t.completedAt), t.subtasks.map(s => `[${s.done ? 'x' : ' '}] ${s.text}`).join(' | '), iso(t.createdAt),
  ]);
  return '\uFEFF' + [head, ...rows].map(r => r.map(cell).join(',')).join('\r\n');
}
function exportCSV() {
  const name = `todolist_tasks_${ymd(new Date())}.csv`;
  download(new Blob([toCSV()], { type: 'text/csv;charset=utf-8' }), name);
  toast(`Exported ${state.tasks.length} task${state.tasks.length === 1 ? '' : 's'} to ${name}`, { type: 'success' });
}

/* Schema validation: returns {ok:false, errors} or {ok:true, tasks, categories, settings, ...} */
function validateImport(data) {
  const errors = [], warnings = [];
  let rawTasks = [], rawCats = [], rawSettings = null, exportedAt = null;
  if (Array.isArray(data)) rawTasks = data;
  else if (data && typeof data === 'object') {
    if (data.app && data.app !== APP_ID) errors.push(`This file was exported by “${String(data.app).slice(0, 40)}”, not by Ember.`);
    if (typeof data.schemaVersion === 'number' && data.schemaVersion > SCHEMA) errors.push(`This backup uses a newer format (version ${data.schemaVersion}). Update the app and try again.`);
    if (!Array.isArray(data.tasks)) errors.push('The file has no “tasks” list.');
    else rawTasks = data.tasks;
    if (data.categories !== undefined) {
      if (Array.isArray(data.categories)) rawCats = data.categories;
      else warnings.push('“categories” is not a list, so tags are rebuilt from the tasks.');
    }
    if (data.settings && typeof data.settings === 'object') rawSettings = data.settings;
    if (typeof data.exportedAt === 'string' && !isNaN(Date.parse(data.exportedAt))) exportedAt = data.exportedAt;
  } else errors.push('The file must hold a JSON object with a “tasks” list.');
  if (errors.length) return { ok: false, errors };

  const tasks = [], seen = new Set(); let skipped = 0;
  rawTasks.forEach((raw, i) => {
    const { task, error } = normalizeTask(raw);
    if (error) { skipped++; if (warnings.length < 4) warnings.push(`Task ${i + 1} ${error}, so it was skipped.`); return; }
    if (seen.has(task.id)) task.id = uid();
    seen.add(task.id); tasks.push(task);
  });
  if (rawTasks.length && !tasks.length) return { ok: false, errors: ['None of the tasks in this file could be read. Every task needs at least a title.'] };
  if (skipped > warnings.length) warnings.push(`${skipped - warnings.length} more task${skipped - warnings.length === 1 ? ' was' : 's were'} skipped.`);

  const categories = normalizeCategories(rawCats);
  tasks.forEach(t => {
    if (t.tag && !categories.some(c => c.name.toLowerCase() === t.tag.toLowerCase())) categories.push({ name: t.tag, color: TAG_COLORS[categories.length % TAG_COLORS.length] });
  });
  return { ok: true, tasks, categories, settings: normalizeSettings(rawSettings), exportedAt, skipped, warnings };
}

async function handleImportFile(file) {
  if (!file) return;
  if (file.size > MAX_IMPORT_BYTES) return showImportError(['This file is larger than 25 MB, which is far beyond any task backup.']);
  let text;
  try { text = await file.text(); } catch (e) { return showImportError(['The file could not be read. Try exporting it again.']); }
  let data;
  try { data = JSON.parse(text.replace(/^\uFEFF/, '')); }
  catch (e) { return showImportError([`The file is not valid JSON (${e.message}).`]); }
  const res = validateImport(data);
  if (!res.ok) return showImportError(res.errors);
  showImportChoice(res, file.name);
}
function showImportError(errors) {
  toast('Import failed. Your tasks were not changed.', { type: 'error' });
  dialog({
    title: 'Import failed',
    body: `<p class="dlg-copy">Your current tasks were not touched. Here is what went wrong:</p><ul class="dlg-list">${errors.slice(0, 6).map(e => `<li>${esc(e)}</li>`).join('')}</ul>`,
    actions: [{ label: 'Close', kind: 'primary' }],
  });
}
function showImportChoice(res, fileName) {
  const n = res.tasks.length, cur = state.tasks.length;
  const when = res.exportedAt ? ` Exported ${new Date(res.exportedAt).toLocaleString()}.` : '';
  const warn = res.warnings.length ? `<ul class="dlg-list">${res.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ul>` : '';
  dialog({
    title: 'Import tasks',
    body: `<p class="dlg-copy"><strong>${esc(fileName)}</strong> holds ${n} task${n === 1 ? '' : 's'} and ${res.categories.length} tag${res.categories.length === 1 ? '' : 's'}.${esc(when)} How should they join the ${cur} you have now?</p>
      <div class="mode-card"><strong>Merge</strong>Adds new tasks and keeps the newer copy of any task found in both. Nothing you have is deleted.</div>
      <div class="mode-card"><strong>Replace</strong>Deletes your current tasks and tags, then loads the backup, including its theme and view settings.</div>${warn}`,
    actions: [
      { label: 'Merge', kind: 'primary', run: () => applyImport(res, 'merge') },
      { label: 'Replace', kind: 'danger', run: () => applyImport(res, 'replace') },
      { label: 'Cancel', kind: 'ghost' },
    ],
  });
}
function applyImport(res, mode) {
  const snap = snapshot();
  let added = 0, updated = 0, same = 0;
  if (mode === 'replace') {
    state.tasks = res.tasks.slice();
    state.categories = res.categories.slice();
    Object.assign(state.settings, res.settings);
    added = res.tasks.length;
  } else {
    res.categories.forEach(c => { if (!state.categories.some(x => x.name.toLowerCase() === c.name.toLowerCase())) state.categories.push({ ...c }); });
    const idx = new Map(state.tasks.map((t, i) => [t.id, i]));
    res.tasks.forEach(t => {
      t.tag = canonicalTag(t.tag);
      if (idx.has(t.id)) {
        const i = idx.get(t.id);
        if (t.updatedAt > state.tasks[i].updatedAt) { state.tasks[i] = t; updated++; } else same++;
      } else { state.tasks.push(t); idx.set(t.id, state.tasks.length - 1); added++; }
    });
  }
  ensureCategories();
  save(); applyTheme(); ui.animateList = true; renderAll();
  const msg = mode === 'replace'
    ? `Imported ${added} task${added === 1 ? '' : 's'}. Your previous list was replaced.`
    : `Merged ${res.tasks.length} task${res.tasks.length === 1 ? '' : 's'}: ${added} added, ${updated} updated, ${same} already up to date.`;
  toast(msg, { type: 'success', action: undoAction(snap), duration: 7000 });
}

/* ==========================================================================
   11. Drag and drop (pointer events, so it works with mouse, pen and touch)
   ========================================================================== */
let drag = null;
const dock = $('#dock');

function startDrag(card, e) {
  const rect = card.getBoundingClientRect();
  const ghost = card.cloneNode(true);
  ghost.classList.remove('enter', 'leaving', 'just-done', 'drag-src');
  ghost.classList.add('ghost');
  Object.assign(ghost.style, { width: rect.width + 'px', left: rect.left + 'px', top: rect.top + 'px' });
  document.body.appendChild(ghost);
  card.classList.add('drag-src');
  document.body.classList.add('is-dragging');
  dock.classList.add('show');
  ui.dragging = true;
  drag = {
    card, ghost, id: card.dataset.id, offX: e.clientX - rect.left, offY: e.clientY - rect.top,
    x: e.clientX, y: e.clientY, over: null,
    startOrder: $$('.task', els.list).map(el => el.dataset.id).join(','),
    timer: setInterval(autoScroll, 16),
  };
  window.addEventListener('pointermove', onDragMove, { passive: false });
  window.addEventListener('pointerup', onDragEnd);
  window.addEventListener('pointercancel', onDragCancel);
}
function onDragMove(e) {
  if (!drag) return;
  e.preventDefault();
  drag.x = e.clientX; drag.y = e.clientY;
  drag.ghost.style.left = (e.clientX - drag.offX) + 'px';
  drag.ghost.style.top = (e.clientY - drag.offY) + 'px';
  // priority dock hit test
  let over = null;
  $$('.dock-btn', dock).forEach(b => {
    const r = b.getBoundingClientRect();
    const hit = e.clientX >= r.left - 8 && e.clientX <= r.right + 8 && e.clientY >= r.top - 4 && e.clientY <= r.bottom + 4;
    b.classList.toggle('over', hit);
    if (hit) over = b.dataset.prio;
  });
  drag.over = over;
  if (!over && canReorder()) placeCard(drag.card, e.clientY);
}
function placeCard(card, y) {
  const cards = $$('.task', els.list);
  const others = cards.filter(c => c !== card);
  let idx = 0;
  for (const c of others) { const r = c.getBoundingClientRect(); if (y > r.top + r.height / 2) idx++; else break; }
  const cur = cards.indexOf(card);
  if (idx === cur) return;
  const before = new Map(others.map(c => [c, c.getBoundingClientRect().top]));
  if (idx > cur) for (let i = cur; i < idx; i++) els.list.insertBefore(others[i], card);
  else for (let i = cur - 1; i >= idx; i--) els.list.insertBefore(others[i], card.nextSibling);
  // FLIP: glide the displaced cards into their new slots
  others.forEach(c => {
    const dy = before.get(c) - c.getBoundingClientRect().top;
    if (dy && c.animate) c.animate([{ transform: `translateY(${dy}px)` }, { transform: 'none' }], { duration: 260, easing: 'cubic-bezier(.22,.8,.24,1)' });
  });
}
function autoScroll() {
  if (!drag) return;
  const r = els.main.getBoundingClientRect(), zone = 70;
  let v = 0;
  if (drag.y < r.top + zone) v = -Math.ceil((r.top + zone - drag.y) / 5);
  else if (drag.y > r.bottom - zone) v = Math.ceil((drag.y - (r.bottom - zone)) / 5);
  if (v && !drag.over) {
    els.main.style.scrollBehavior = 'auto';
    els.main.scrollTop += Math.max(-22, Math.min(22, v));
    if (canReorder()) placeCard(drag.card, drag.y);
  }
}
function endDrag() {
  clearInterval(drag.timer);
  window.removeEventListener('pointermove', onDragMove);
  window.removeEventListener('pointerup', onDragEnd);
  window.removeEventListener('pointercancel', onDragCancel);
  document.body.classList.remove('is-dragging');
  dock.classList.remove('show');
  $$('.dock-btn', dock).forEach(b => b.classList.remove('over'));
  els.main.style.scrollBehavior = '';
  ui.dragging = false;
}
function onDragEnd() {
  if (!drag) return;
  const d = drag;
  endDrag();
  // settle the ghost into the placeholder before removing it
  const target = d.card.getBoundingClientRect();
  d.ghost.style.transition = 'left .2s var(--ease), top .2s var(--ease), transform .2s var(--ease), opacity .2s';
  if (!d.over) Object.assign(d.ghost.style, { left: target.left + 'px', top: target.top + 'px', transform: 'none' });
  else d.ghost.style.opacity = '0';
  setTimeout(() => d.ghost.remove(), 210);
  drag = null;
  if (d.over) { setPriority(d.id, d.over); return; }
  const order = $$('.task', els.list).map(el => el.dataset.id).join(',');
  if (order !== d.startOrder && canReorder()) { commitOrder(); save(); }
  else if (order === d.startOrder && !canReorder() && drag === null && Math.abs(d.y - (d.card.getBoundingClientRect().top)) > 40) {
    toast('Switch the sort to Manual order to drag tasks into a new sequence.', { type: 'info' });
  }
  renderList();
}
function onDragCancel() {
  if (!drag) return;
  const d = drag; endDrag(); d.ghost.remove(); drag = null; renderList();
}

/* ==========================================================================
   12. Theme, PWA and status
   ========================================================================== */
function applyTheme() {
  const th = state.settings.theme === 'light' ? 'light' : 'dark';
  document.documentElement.dataset.theme = th;
  $('#themeColor').setAttribute('content', th === 'dark' ? '#1c1917' : '#efe5d2');
}
function toggleTheme() {
  state.settings.theme = state.settings.theme === 'dark' ? 'light' : 'dark';
  applyTheme(); save();
}
let deferredInstall = null;
function updateStatus() {
  const off = !navigator.onLine;
  $('#status').classList.toggle('offline', off);
  $('#statusText').textContent = off ? 'Offline. Everything stays on this device.' : 'Saved on this device';
}
function setupPWA() {
  const icon64 = 'data:image/svg+xml;utf8,' + encodeURIComponent(APP_ICON);
  $('#favicon').href = icon64;
  if (!/^https?:$/.test(location.protocol)) return; // PWA features need http(s)
  try {
    const manifest = {
      name: 'Ember – To-Do', short_name: 'Ember', description: 'An offline-first to-do list.',
      start_url: location.href.split('#')[0], scope: new URL('./', location.href).href, display: 'standalone',
      background_color: '#1c1917', theme_color: '#1c1917',
      icons: [{ src: icon64, sizes: 'any', type: 'image/svg+xml', purpose: 'any' }],
    };
    $('#manifestLink').href = URL.createObjectURL(new Blob([JSON.stringify(manifest)], { type: 'application/manifest+json' }));
  } catch (e) { /* manifest is optional */ }
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(() => navigator.serviceWorker.ready).then(reg => {
      if (reg.active) reg.active.postMessage({ type: 'CACHE_URLS', urls: [location.href.split('#')[0]] });
    }).catch(() => { /* sw.js not deployed next to this file: the app still runs, just without offline reloads */ });
  }
  window.addEventListener('beforeinstallprompt', e => {
    e.preventDefault(); deferredInstall = e;
    const b = $('#btnInstall'); b.hidden = false;
  });
  window.addEventListener('appinstalled', () => { $('#btnInstall').hidden = true; deferredInstall = null; toast('Ember is installed.', { type: 'success' }); });
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
}

/* ==========================================================================
   13. Events
   ========================================================================== */
function setView(id) {
  if (!VIEW_IDS.includes(id)) return;
  state.settings.view = id; ui.tag = ''; ui.animateList = true;
  save(); renderAll();
  els.main.scrollTop = 0;
}
function selectTag(name) {
  if (ui.tag === name) { ui.tag = ''; ui.status = 'any'; }
  else { ui.tag = name; state.settings.view = 'all'; ui.status = 'open'; }
  ui.animateList = true; save(); renderAll(); els.main.scrollTop = 0;
}
function resetFilters() {
  ui.q = ''; ui.priority = ''; ui.tag = ''; ui.status = 'any'; els.search.value = '';
  renderAll();
}
const closeNav = () => els.app.classList.remove('nav-open');

function bindEvents() {
  // Icons that live in static markup
  $('#qPlus').innerHTML = icon('plus', 20);
  $('#quickDetails').innerHTML = icon('sliders', 19);
  $('#searchIcon').innerHTML = icon('search', 16);
  $('#btnMenu').innerHTML = icon('menu', 20);
  $$('.js-theme').forEach(b => { b.innerHTML = `<span class="sun" style="grid-area:1/1;display:grid">${icon('sun', 19)}</span><span class="moon" style="grid-area:1/1;display:grid">${icon('moon', 19)}</span>`; b.addEventListener('click', toggleTheme); });
  $('#btnExportJson').innerHTML = icon('download', 15) + 'Export JSON';
  $('#btnExportCsv').innerHTML = icon('download', 15) + 'Export CSV';
  $('#btnImport').innerHTML = icon('upload', 15) + 'Import backup';
  $('#btnInstall').innerHTML = icon('phone', 15) + 'Install app';

  // Sidebar
  els.views.addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) { setView(b.dataset.view); closeNav(); } });
  els.tagList.addEventListener('click', e => { const b = e.target.closest('[data-tag]'); if (b) { selectTag(b.dataset.tag); closeNav(); } });
  els.views.addEventListener('animationend', e => e.target.classList.remove('bump'));
  $('#btnMenu').addEventListener('click', () => els.app.classList.add('nav-open'));
  $('#navScrim').addEventListener('click', closeNav);
  $('#btnExportJson').addEventListener('click', exportJSON);
  $('#btnExportCsv').addEventListener('click', exportCSV);
  $('#btnImport').addEventListener('click', () => $('#importFile').click());
  $('#importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; handleImportFile(f); });
  $('#btnInstall').addEventListener('click', async () => {
    if (!deferredInstall) return;
    deferredInstall.prompt(); await deferredInstall.userChoice.catch(() => {}); deferredInstall = null; $('#btnInstall').hidden = true;
  });

  // Quick add
  $('#quickForm').addEventListener('submit', e => {
    e.preventDefault();
    const title = els.quickInput.value.trim();
    if (!title) { const f = $('#quickForm'); f.classList.remove('shake'); void f.offsetWidth; f.classList.add('shake'); els.quickInput.focus(); return; }
    const t = addTask({ title, priority: ui.quickPriority, dueDate: defaultDueForView(), tag: ui.tag });
    els.quickInput.value = '';
    if (t && !getVisible().some(x => x.id === t.id)) toast('Task added. It sits outside the current view or filters.', { type: 'info' });
  });
  els.quickPriority.addEventListener('click', () => {
    const i = PRIORITY_IDS.indexOf(ui.quickPriority);
    ui.quickPriority = PRIORITY_IDS[(i + 1) % PRIORITY_IDS.length]; renderFilters();
  });
  $('#quickDetails').addEventListener('click', () => {
    openEditor(null, { title: els.quickInput.value.trim(), priority: ui.quickPriority, dueDate: defaultDueForView(), tag: ui.tag });
    els.quickInput.value = '';
  });

  // Search and filters
  let st;
  els.search.addEventListener('input', () => { clearTimeout(st); st = setTimeout(() => { ui.q = els.search.value; renderList(); els.btnReset.hidden = !hasFilters(); }, 110); });
  els.fPriority.addEventListener('change', () => { ui.priority = els.fPriority.value; renderAll(); });
  els.fTag.addEventListener('change', () => { ui.tag = els.fTag.value; renderAll(); });
  els.fStatus.addEventListener('change', () => { ui.status = els.fStatus.value; renderAll(); });
  els.fSort.addEventListener('change', () => { state.settings.sort = els.fSort.value; save(); renderAll(); });
  els.btnReset.addEventListener('click', resetFilters);
  $('#btnClear').addEventListener('click', clearCompleted);

  // Task list (event delegation)
  els.list.addEventListener('click', e => {
    const actEl = e.target.closest('[data-act]'); if (!actEl) return;
    const act = actEl.dataset.act;
    if (act === 'reset') return resetFilters();
    if (act === 'searchall') { state.settings.view = 'all'; ui.status = 'any'; ui.animateList = true; save(); return renderAll(); }
    const card = actEl.closest('.task'); if (!card) return;
    const id = card.dataset.id;
    if (act === 'check') toggleComplete(id);
    else if (act === 'edit') openEditor(id);
    else if (act === 'dup') duplicateTask(id);
    else if (act === 'del') deleteTask(id);
    else if (act === 'subs') { ui.expanded.has(id) ? ui.expanded.delete(id) : ui.expanded.add(id); renderList(); }
    else if (act === 'subcheck') toggleSub(id, actEl.dataset.sub);
  });
  els.list.addEventListener('pointerdown', e => {
    const grip = e.target.closest('.grip'); if (!grip || (e.button !== undefined && e.button > 0)) return;
    const card = grip.closest('.task'); if (!card || drag) return;
    e.preventDefault(); startDrag(card, e);
  });
  els.list.addEventListener('contextmenu', e => { if (e.target.closest('.grip')) e.preventDefault(); });
  // Keyboard reordering: Alt + Arrow Up / Down on the grip
  els.list.addEventListener('keydown', e => {
    const grip = e.target.closest('.grip');
    if (!grip || !e.altKey || !['ArrowUp', 'ArrowDown'].includes(e.key)) return;
    e.preventDefault();
    if (!canReorder()) return toast('Switch the sort to Manual order to move tasks.', { type: 'info' });
    const card = grip.closest('.task'), sib = e.key === 'ArrowUp' ? card.previousElementSibling : card.nextElementSibling;
    if (!sib || !sib.classList.contains('task')) return;
    e.key === 'ArrowUp' ? els.list.insertBefore(card, sib) : els.list.insertBefore(sib, card);
    commitOrder(); save(); renderList();
    const again = cardEl(card.dataset.id); if (again) $('.grip', again).focus();
  });

  // Global keys
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      if (drag) return onDragCancel();
      if (!overlay.hidden) return closeOverlay();
      closeNav();
    }
    if (e.key === 'Tab' && !overlay.hidden) { // keep focus inside the dialog
      const f = $$('button:not([disabled]),input:not([type=hidden]):not([disabled]),textarea,select,[href]', oPanel).filter(x => x.offsetParent !== null);
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    const typing = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '');
    if (!typing && overlay.hidden && !e.metaKey && !e.ctrlKey && !e.altKey) {
      if (e.key === '/') { e.preventDefault(); els.search.focus(); }
      if (e.key === 'n') { e.preventDefault(); els.quickInput.focus(); }
    }
  });

  // Keep several open tabs in sync
  window.addEventListener('storage', e => {
    if (e.key !== LS_KEY || !e.newValue || ui.dragging) return;
    try { const s = normalizeState(JSON.parse(e.newValue)); if (s) { state = s; applyTheme(); renderAll(); } } catch (err) { /* ignore */ }
  });
  window.addEventListener('online', updateStatus);
  window.addEventListener('offline', updateStatus);

  // Overdue states and "today" move with the clock
  let lastKey = ranges().today + ranges().nowHM;
  setInterval(() => {
    const r = ranges(), key = r.today + r.nowHM;
    if (key === lastKey) return;
    lastKey = key;
    const tag = (document.activeElement || {}).tagName;
    if (!ui.dragging && overlay.hidden && tag !== 'SELECT') { renderSidebar(); renderList(); }
  }, 20000);
}

/* ==========================================================================
   14. Boot
   ========================================================================== */
(async function init() {
  bindEvents();
  setupPWA();
  updateStatus();
  const stored = await loadState();
  if (stored) state = stored;
  else { state = makeSeed(); ensureCategories(); }
  ensureCategories();
  applyTheme();
  save();
  ui.animateList = true;
  renderAll();
})();
})();
</script>
</body>
